# ============================================================
#  Render Blueprint for WiseProfit
# ============================================================
#  Apply this file from the Render dashboard ("New > Blueprint") to
#  provision the Web Service + PostgreSQL database in a single step.
#
#  Manual alternative: create a Web Service manually and paste the
#  commands listed under "services.0" below.
# ============================================================
services:
  - type: web
    name: wiseprofit
    runtime: python
    plan: starter           # free tier is "free"; upgrade to "starter" for always-on
    region: oregon           # pick the region closest to your users
    branch: main            # change if you deploy from a different branch
    # The FastAPI app lives at the repository root, so no rootDir is needed.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false           # you must enter this in the Render dashboard
      - key: GROQ_API_KEY
        sync: false           # optional fallback provider
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: SECRET_KEY
        generateValue: true   # signs sessions and encrypts stored MT5 credentials
      - key: DATABASE_URL
        fromService:
          type: psql
          name: wiseprofit-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DISABLE_BOT
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ENV
        value: "production"
      - key: NEWS_FILTER_FAIL_OPEN
        value: "false"
      - key: BRIDGE_MODE
        value: "true"
      - key: PENDING_SIGNAL_TTL_SECONDS
        value: "90"

databases:
  - name: wiseprofit-db
    plan: free              # Render free PostgreSQL; upgrade for production SLA
    region: oregon
    databaseName: wiseprofit
    user: wiseprofit_user